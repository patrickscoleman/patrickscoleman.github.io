<style id="css">

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;flex-direction:column;min-width:0}

.status{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:5px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--mute);display:inline-block}
.status.live i{background:#2f9e5b}.status.pending i{background:var(--hi)}
.me{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;white-space:nowrap;max-width:9.5em;overflow:hidden;text-overflow:ellipsis}
.me span{color:var(--mute);font-weight:500}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;flex:1}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-weight:700;font-size:14px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg small{font-weight:500;opacity:.65}
.ctrls{display:flex;gap:8px;margin-top:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}

main{max-width:680px;margin:0 auto;padding:14px 16px 8px}

h2 span{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;border-left:5px solid var(--sc)}
.t{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.t b{font-size:18px;font-weight:800}.t span{font-size:13px;color:var(--mute)}
.n{font-size:18px;font-weight:700;line-height:1.2;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-size:13px;color:var(--mute)}
.stg{color:var(--sc);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.whos{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.who{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.who.you{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tog{border-radius:999px;border:1.5px solid var(--sc);padding:6px 11px;font-size:13px;font-weight:800;color:var(--sc);white-space:nowrap;background:var(--card)}
.tog.on{border-color:var(--line);color:var(--mute);background:var(--bg)}
.n .live{margin-left:8px;vertical-align:3px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--hi);padding:2px 7px;border-radius:999px}
.set.now{box-shadow:0 0 0 2px var(--hi)}
.set.past{opacity:.55}
.empty{color:var(--mute);padding:12px 0}
.full{margin-top:18px}
.full summary{cursor:pointer;font-weight:700;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.full summary span{color:var(--mute);font-weight:500;font-size:14px}
.full[open] summary{margin-bottom:8px}
.full .set{padding:9px 12px 9px 14px}.full .n{font-size:16px}.full .t b{font-size:16px}
/* grid */
.gwrap{margin:0 -16px;padding:0 8px 0 0}
.ghead{position:sticky;top:var(--hh,120px);z-index:5;display:grid;grid-template-columns:34px repeat(5,1fr);gap:3px;background:var(--bg);padding:6px 0 6px}
.ghead div{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--sc);text-align:center;border-bottom:3px solid var(--sc);padding-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid{position:relative;display:grid;grid-template-columns:34px repeat(5,1fr);gap:3px}
.axis{position:relative}
.axis span{position:absolute;right:4px;font-size:11px;color:var(--mute);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.col{position:relative;border-left:1px dashed var(--line)}
.hr{position:absolute;left:34px;right:0;border-top:1px solid var(--line);pointer-events:none}
.blk{position:absolute;left:1px;right:1px;border-radius:7px;padding:3px 4px;text-align:left;overflow:hidden;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--sc);display:flex;flex-direction:column;gap:1px}
.blk .bn{font-size:11.5px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.blk .bt{font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums}
.blk .bc{font-size:10px;font-weight:700;color:var(--sc)}
.blk.others{background:color-mix(in srgb,var(--sc) 14%,var(--card));border-color:color-mix(in srgb,var(--sc) 45%,var(--line))}
.blk.mine{background:var(--sc);border-color:var(--sc);color:#fff}
.blk.mine .bt,.blk.mine .bc{color:#fff;opacity:.9}
.blk.past{opacity:.5}
.nowline{position:absolute;left:30px;right:0;border-top:2px solid var(--hi);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--hi)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin:12px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line);background:var(--card)}

.sheet h3{margin:0;font-size:22px;letter-spacing:-.01em}

.acts{display:flex;gap:8px;margin-top:16px}

.add{display:flex;gap:8px;margin-top:10px}
